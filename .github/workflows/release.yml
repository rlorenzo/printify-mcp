name: Release

# Cut a release with `npm version patch|minor|major && git push --follow-tags`.
# The tag triggers this workflow, which publishes to npm and creates a GitHub
# Release with generated notes.
#
# Auth is npm Trusted Publishing (OIDC): no token. Configure once on npmjs.com
# under the package's Settings > Trusted Publisher: GitHub Actions,
# owner rlorenzo, repo printify-mcp, workflow release.yml, environment npm.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # gh release create
  id-token: write   # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Check tag matches package.json
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME != package.json version"; exit 1; }

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm publish

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
