name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here needs authenticated git access; leaving the token in
          # .git/config would expose it to anything the build runs.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (oxlint)
        run: npm run lint

      - name: Lint (markdown)
        run: npm run lint:md

      # TEMPORARY: confirms that mkdir under /proc is what stalled the suite.
      - name: Probe /proc mkdir
        timeout-minutes: 2
        run: |
          node -e "
            const fs = require('fs');
            console.log('probing mkdirSync(/proc/nope, {recursive:true})');
            const t = Date.now();
            try { fs.mkdirSync('/proc/nope', { recursive: true }); console.log('unexpectedly succeeded'); }
            catch (e) { console.log('threw', e.code, 'after', Date.now() - t, 'ms'); }
          " &
          probe=$!
          sleep 20
          if kill -0 $probe 2>/dev/null; then echo "PROBE HUNG"; kill -9 $probe; else echo "probe returned"; fi

      # Integration tests spawn the built server, so this must follow the build.
      - name: Test
        timeout-minutes: 6
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  gate:
    name: Regression gate (fallow)
    runs-on: ubuntu-latest
    steps:
      # The gate diffs against the merge-base, so it needs full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # CRAP combines complexity with coverage. Without real coverage data
      # fallow estimates it from export references, which reports functions as
      # critical purely because it cannot see their tests.
      - name: Build and collect coverage
        timeout-minutes: 6
        run: npm run build && npm run test:coverage

      # Fails only on dead code, duplication or complexity introduced by this
      # change. Pre-existing findings are inherited from the committed baselines
      # and do not block unrelated work.
      - name: Audit changed files
        run: |
          npx fallow audit --format github-annotations --gate new-only \
            --coverage coverage/coverage-final.json \
            --health-baseline .fallow/health.baseline.json \
            --dupes-baseline .fallow/dupes.baseline.json \
            --dead-code-baseline .fallow/dead-code.baseline.json

      - name: Job summary
        if: always()
        run: npx fallow audit --format github-summary --coverage coverage/coverage-final.json >> "$GITHUB_STEP_SUMMARY"
