version: 2
updates:
  # Actions are pinned to commit SHAs for immutability, which means they do not
  # pick up upstream fixes on their own. Dependabot rewrites the pins (keeping
  # the trailing version comment accurate) so they stay current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        dependency-type: development
